version: 1.0.{build}

image: Visual Studio 2022

branches:
  only:
    - main
    - /^v\d.*/   # Tags wie v1.0.0 loesen den Release-Build aus

configuration: Release

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

# Bei Tag-Builds (v0.1.1-a) die AppVeyor-Build-Version aus dem Tag ableiten (0.1.1-a).
# Schlaegt das fehl (z.B. Rebuild desselben Tags: Version existiert schon),
# bleibt die Standardversion 1.0.{build}.
init:
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -eq "true") {
        $tagVersion = $env:APPVEYOR_REPO_TAG_NAME -replace '^v', ''
        try { Update-AppveyorBuild -Version $tagVersion }
        catch { Write-Warning "Build-Version konnte nicht auf $tagVersion gesetzt werden: $_" }
      }

install:
  - dotnet --info

before_build:
  - dotnet restore MacroKeyboardSync\MacroKeyboardSync.csproj -r win-x64

build_script:
  - dotnet build MacroKeyboardSync\MacroKeyboardSync.csproj -c %CONFIGURATION% -r win-x64 -p:Version=%APPVEYOR_BUILD_VERSION% --no-restore
  - dotnet publish MacroKeyboardSync\MacroKeyboardSync.csproj -c %CONFIGURATION% -r win-x64 --self-contained false -p:Version=%APPVEYOR_BUILD_VERSION% --no-restore -o publish\MacroKeyboardSync
  - 7z a MacroKeyboardSync.zip .\publish\MacroKeyboardSync\*
  - 7z a MacroKeyboardPico.zip .\src\*

# Keine Unit-Tests vorhanden
test: off

artifacts:
  - path: MacroKeyboardSync.zip
    name: MacroKeyboardSync
  - path: MacroKeyboardPico.zip
    name: MacroKeyboardPico

# GitHub-Release nur bei Tag-Builds (git tag v1.0.0 && git push --tags).
# auth_token: GitHub Personal Access Token (Scope "public_repo" bzw. "repo"),
# in AppVeyor unter Account -> Encrypt YAML verschluesseln und hier einsetzen.
deploy:
  - provider: GitHub
    release: MiniMacroKeyboard $(APPVEYOR_REPO_TAG_NAME)
    tag: $(APPVEYOR_REPO_TAG_NAME)
    description: 'Release $(APPVEYOR_REPO_TAG_NAME): Windows-Companion-App (MacroKeyboardSync) und Pico-Dateien (boot.py, code.py, macros.py.template).'
    auth_token:
      secure: sjnQQ4R0jVVuk08yTOOnlKbTK4RvhDpSWTapKgyKmoQw/FoRdCbdRqBJJQpL4AmO
    artifact: MacroKeyboardSync, MacroKeyboardPico
    draft: false
    prerelease: true
    on:
      APPVEYOR_REPO_TAG: true
